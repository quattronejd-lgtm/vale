name: Harold daily post

on:
  schedule:
    # Four posts a day: 9am, 12pm, 3pm, 6pm America/Chicago, year-round.
    # GitHub cron is UTC-only, so fire at both CDT and CST candidates for
    # each slot and let the timezone guard run exactly the right ones.
    #
    # KNOWN UNRELIABLE: GitHub's own scheduler has been observed to (a) delay
    # firing by 70+ minutes, and (b) on at least one occasion, not fire AT ALL
    # for a slot (no run of any kind, not even late). (a) is handled by the
    # delay-invariant guard below; (b) cannot be fixed from inside this
    # workflow, since there's no run to correct — hence repository_dispatch
    # below as an independent backstop clock.
    - cron: "7 14 * * *"   # 9am CDT
    - cron: "7 15 * * *"   # 9am CST / 10am CDT (guard skips)
    - cron: "7 17 * * *"   # 12pm CDT
    - cron: "7 18 * * *"   # 12pm CST / 1pm CDT (guard skips)
    - cron: "7 20 * * *"   # 3pm CDT
    - cron: "7 21 * * *"   # 3pm CST / 4pm CDT (guard skips)
    - cron: "7 23 * * *"   # 6pm CDT
    - cron: "7 0 * * *"    # 6pm CST / 7pm CDT (guard skips)
  # Backstop trigger: an external cron service (outside GitHub Actions'
  # scheduler entirely) can POST to the GitHub API to fire this event at each
  # slot. See README "Scheduling" section for exact setup. Because the
  # external service already fires at the correct America/Chicago-local time,
  # no DST-twin logic is needed for this trigger type — it always runs.
  repository_dispatch:
    types: [harold-post-slot]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options:
          - dry-run
          - live
        default: dry-run

concurrency:
  group: harold-daily
  cancel-in-progress: false

permissions:
  contents: write # to commit the posted.json ledger back after a live post

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harold
    env:
      # Public config (not secrets)
      NETLIFY_SITE_ID: 1536eb41-70ea-4b6b-aa6f-54f404810ba9
      PUBLIC_IMAGE_BASE: https://harold-cards.netlify.app
      # publish.js auto-detects the token flavor (IGAA -> graph.instagram.com,
      # EAA -> graph.facebook.com); set IG_GRAPH_BASE here only to override.
      # Secrets — set in repo Settings → Secrets and variables → Actions → Secrets
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: DST-twin guard (delay-invariant, staleness-capped)
        id: guard
        working-directory: .
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # GitHub's cron delay has been observed anywhere from a few minutes to
          # 70+ minutes. A wall-clock "is it currently hour 9/12/15/18" check
          # breaks once the delay crosses an hour boundary — a noon-slot run
          # landing at 1:17pm reads as "not a slot" and self-skips (this is what
          # happened to one noon post). Fixed by keying off WHICH cron string
          # fired (github.event.schedule) — that encodes the intended slot
          # regardless of how late the run executes — and checking the CURRENT
          # DST offset to pick the active CDT/CST twin, since DST only flips
          # twice a year and can't be thrown off by a same-day delay.
          #
          # CONFIRMED 2026-07-17: that "regardless of delay" guard has no upper
          # bound, and GitHub's scheduler can delay a LOT more than 70 minutes —
          # run 29563273381 fired schedule "7 23 * * *" (intended 23:07 UTC /
          # 6:07pm CDT) at 07:30:04 UTC the next calendar day, 8h23m late, and
          # posted live at 2:30am CDT. Fixed by ALSO capping staleness: compute
          # minutes elapsed since this schedule string's actual intended UTC
          # trigger time and skip if it's beyond a generous margin over the
          # worst *legitimate* delay seen (70min) — comfortably below an 8-hour
          # misfire. A skip here is covered by the repository_dispatch backstop
          # (fires at the exact intended time on an independent clock) or a
          # manual catch-up dispatch.
          MAX_STALE_MINUTES=150
          OFFSET="$(TZ=America/Chicago date +%z)"   # -0500 (CDT) or -0600 (CST)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running."
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "External backstop cron fired (repository_dispatch) — running."
          else
            case "$SCHEDULE" in
              "7 14 * * *") EXPECT="-0500" ;;  # 9am CDT
              "7 15 * * *") EXPECT="-0600" ;;  # 9am CST
              "7 17 * * *") EXPECT="-0500" ;;  # 12pm CDT
              "7 18 * * *") EXPECT="-0600" ;;  # 12pm CST
              "7 20 * * *") EXPECT="-0500" ;;  # 3pm CDT
              "7 21 * * *") EXPECT="-0600" ;;  # 3pm CST
              "7 23 * * *") EXPECT="-0500" ;;  # 6pm CDT
              "7 0 * * *")  EXPECT="-0600" ;;  # 6pm CST
              *) EXPECT="" ;;
            esac
            if [ -z "$EXPECT" ] || [ "$OFFSET" != "$EXPECT" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Schedule '$SCHEDULE' is the off-DST twin (offset $OFFSET, expected $EXPECT) — skipping."
            else
              set -- $SCHEDULE
              CMIN="$1"; CHOUR="$2"
              NOW_EPOCH="$(date -u +%s)"
              TODAY_TRIGGER="$(date -u -d "today ${CHOUR}:${CMIN}" +%s)"
              STALE_SECONDS=$(( NOW_EPOCH - TODAY_TRIGGER ))
              if [ "$STALE_SECONDS" -lt 0 ]; then
                STALE_SECONDS=$(( STALE_SECONDS + 86400 ))
              fi
              STALE_MINUTES=$(( STALE_SECONDS / 60 ))
              if [ "$STALE_MINUTES" -le "$MAX_STALE_MINUTES" ]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "Schedule '$SCHEDULE' matches current DST offset ($OFFSET), ${STALE_MINUTES}m late (<= ${MAX_STALE_MINUTES}m cap) — running."
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "Schedule '$SCHEDULE' matches DST offset ($OFFSET) but is ${STALE_MINUTES}m late (> ${MAX_STALE_MINUTES}m cap) — GitHub's scheduler badly delayed this firing; skipping rather than post at the wrong real-world time."
              fi
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harold/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.guard.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Decide mode
        if: steps.guard.outputs.run == 'true'
        id: mode
        run: |
          # Manual runs use the dispatch input. Scheduled runs go live only when
          # the repo variable HAROLD_LIVE is exactly 'true' (Settings → Secrets
          # and variables → Actions → Variables) — dry-run otherwise.
          LIVE_FLAG="$(echo "${{ vars.HAROLD_LIVE }}" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "$LIVE_FLAG" = "true" ]; then
            MODE="live"
          else
            MODE="dry-run"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Run Harold (${{ steps.mode.outputs.mode }})
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "live" ]; then
            node src/run.js --live
          else
            node src/run.js --dry-run
          fi

      - name: Upload rendered card
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_id }}
          path: harold/out/card.jpg
          retention-days: 30

      - name: Commit ledger (live runs only)
        if: steps.guard.outputs.run == 'true' && steps.mode.outputs.mode == 'live'
        run: |
          if git diff --quiet -- data/posted.json; then
            echo "Ledger unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "harold-bot"
          git config user.email "harold-bot@users.noreply.github.com"
          git add data/posted.json
          git commit -m "Harold: ledger update after live post [skip ci]"
          git push
