name: Harold daily post

on:
  schedule:
    # Four posts a day: 9am, 12pm, 3pm, 6pm America/Chicago, year-round.
    # GitHub cron is UTC-only, so fire at both CDT and CST candidates for
    # each slot and let the timezone guard run exactly the right ones.
    - cron: "7 14 * * *"   # 9am CDT
    - cron: "7 15 * * *"   # 9am CST / 10am CDT (guard skips)
    - cron: "7 17 * * *"   # 12pm CDT
    - cron: "7 18 * * *"   # 12pm CST / 1pm CDT (guard skips)
    - cron: "7 20 * * *"   # 3pm CDT
    - cron: "7 21 * * *"   # 3pm CST / 4pm CDT (guard skips)
    - cron: "7 23 * * *"   # 6pm CDT
    - cron: "7 0 * * *"    # 6pm CST / 7pm CDT (guard skips)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options:
          - dry-run
          - live
        default: dry-run

concurrency:
  group: harold-daily
  cancel-in-progress: false

permissions:
  contents: write # to commit the posted.json ledger back after a live post

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harold
    env:
      # Public config (not secrets)
      NETLIFY_SITE_ID: 1536eb41-70ea-4b6b-aa6f-54f404810ba9
      PUBLIC_IMAGE_BASE: https://harold-cards.netlify.app
      # publish.js auto-detects the token flavor (IGAA -> graph.instagram.com,
      # EAA -> graph.facebook.com); set IG_GRAPH_BASE here only to override.
      # Secrets — set in repo Settings → Secrets and variables → Actions → Secrets
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: DST-twin guard (delay-invariant — do not switch back to an hour check)
        id: guard
        working-directory: .
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # GitHub's cron delay has been observed anywhere from a few minutes to
          # 70+ minutes. A wall-clock "is it currently hour 9/12/15/18" check
          # breaks once the delay crosses an hour boundary — a noon-slot run
          # landing at 1:17pm reads as "not a slot" and self-skips (this is what
          # happened to today's noon post). Fixed by keying off WHICH cron
          # string fired (github.event.schedule) — that encodes the intended
          # slot regardless of how late the run actually executes — and only
          # checking the CURRENT DST offset to pick the active CDT/CST twin.
          # DST offset only flips twice a year, so it can't be thrown off by a
          # same-day scheduling delay the way an hour check can.
          OFFSET="$(TZ=America/Chicago date +%z)"   # -0500 (CDT) or -0600 (CST)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running."
          else
            case "$SCHEDULE" in
              "7 14 * * *") EXPECT="-0500" ;;  # 9am CDT
              "7 15 * * *") EXPECT="-0600" ;;  # 9am CST
              "7 17 * * *") EXPECT="-0500" ;;  # 12pm CDT
              "7 18 * * *") EXPECT="-0600" ;;  # 12pm CST
              "7 20 * * *") EXPECT="-0500" ;;  # 3pm CDT
              "7 21 * * *") EXPECT="-0600" ;;  # 3pm CST
              "7 23 * * *") EXPECT="-0500" ;;  # 6pm CDT
              "7 0 * * *")  EXPECT="-0600" ;;  # 6pm CST
              *) EXPECT="" ;;
            esac
            if [ -n "$EXPECT" ] && [ "$OFFSET" = "$EXPECT" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Schedule '$SCHEDULE' matches current DST offset ($OFFSET) — running, regardless of delay."
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Schedule '$SCHEDULE' is the off-DST twin (offset $OFFSET, expected $EXPECT) — skipping."
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harold/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.guard.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Decide mode
        if: steps.guard.outputs.run == 'true'
        id: mode
        run: |
          # Manual runs use the dispatch input. Scheduled runs go live only when
          # the repo variable HAROLD_LIVE is exactly 'true' (Settings → Secrets
          # and variables → Actions → Variables) — dry-run otherwise.
          LIVE_FLAG="$(echo "${{ vars.HAROLD_LIVE }}" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "$LIVE_FLAG" = "true" ]; then
            MODE="live"
          else
            MODE="dry-run"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Run Harold (${{ steps.mode.outputs.mode }})
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "live" ]; then
            node src/run.js --live
          else
            node src/run.js --dry-run
          fi

      - name: Upload rendered card
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_id }}
          path: harold/out/card.jpg
          retention-days: 30

      - name: Commit ledger (live runs only)
        if: steps.guard.outputs.run == 'true' && steps.mode.outputs.mode == 'live'
        run: |
          if git diff --quiet -- data/posted.json; then
            echo "Ledger unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "harold-bot"
          git config user.email "harold-bot@users.noreply.github.com"
          git add data/posted.json
          git commit -m "Harold: ledger update after live post [skip ci]"
          git push
