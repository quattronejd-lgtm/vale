<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GNN Card</title>
  <link rel="stylesheet" href="card.css" />
</head>
<body>
  <!--
    THE LOCKED TEMPLATE — APPROVED 2026-07-15 (Joe). Do not restyle.
    render.js only fills:
      #hero        -> img src (hero photo)
      #headline    -> innerHTML (with <span class="kw"> around orange words)
    and runs the auto-fit routine to scale #headline to the safe box.
  -->
  <div class="card" id="card">
    <img class="hero" id="hero" alt="" />

    <div class="scrim"></div>

    <!-- GNN flower logo: seed-of-life cluster inside a ring. White on transparent,
         centered up top. -->
    <div class="badge" id="badge" aria-label="Good News Network">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <circle class="badge-ring" cx="100" cy="100" r="70" />
        <g class="badge-flower">
          <circle cx="100"   cy="100" r="18" />
          <circle cx="100"   cy="62"  r="18" />
          <circle cx="132.9" cy="81"  r="18" />
          <circle cx="132.9" cy="119" r="18" />
          <circle cx="100"   cy="138" r="18" />
          <circle cx="67.1"  cy="119" r="18" />
          <circle cx="67.1"  cy="81"  r="18" />
        </g>
      </svg>
    </div>

    <!-- Headline safe box: bottom-left. Font-size is set by the auto-fit routine. -->
    <div class="headline-wrap" id="headline-wrap">
      <h1 class="headline" id="headline"><!-- injected --></h1>
    </div>
  </div>
</body>
</html>
